name: CI Documentation Checks

on: [pull_request]

jobs:
  lint-markdown:
    name: Lint markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: tcort/github-action-markdown-link-check@1.1.0
        with:
          use-verbose-mode: "yes"
          config-file: ".github/workflows/mlc_config.json"
